<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/login.css">
    <title>Sign Up</title>
</head>
<body>
    <main id="div2" class="signup">
        <h1>Sign Up</h1>
        <form action="logintest.html">
            <label for="first-name">Name</label>
            <input class="input" type="text" id="first-name" autocomplete="given-name" required>

            <label for="last-name">Last Name</label>
            <input class="input" type="text" id="last-name" autocomplete="family-name" required>

            <label for="username">Username (email address)</label>
            <input class="input" type="email" id="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input class="input" type="password" id="password" autocomplete="new-password" required>

            <label for="repeat-password">Repeat Password</label>
            <input class="input" type="password" id="repeat-password" autocomplete="new-password" required>

            <button type="submit" id="btn2">Sign Up</button>
        </form>
    </main>
</body>
</html>
